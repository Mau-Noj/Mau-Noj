name: 📺 Último Video de YouTube

on:
  schedule:
    - cron: "0 */6 * * *" # Cada 6 horas
  workflow_dispatch:

jobs:
  update-video:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch latest video and update README
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          import xml.etree.ElementTree as ET

          CHANNEL_ID = "UCiLwp9BQNx497pj3Z2nn-kA"
          url = f"https://www.youtube.com/feeds/videos.xml?channel_id={CHANNEL_ID}"

          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=15) as resp:
              data = resp.read()

          ns = {
              "atom": "http://www.w3.org/2005/Atom",
              "yt": "http://www.youtube.com/xml/schemas/2015",
          }
          root = ET.fromstring(data)
          entry = root.find("atom:entry", ns)
          if entry is None:
              raise SystemExit("No entries found in feed")

          video_id = entry.find("yt:videoId", ns).text
          title = entry.find("atom:title", ns).text

          block = (
              f'<a href="https://www.youtube.com/watch?v={video_id}">'
              f'<img src="https://i.ytimg.com/vi/{video_id}/hqdefault.jpg" width="45%" alt="Último video" />'
              f'</a>\n\n**🎬 Último video:** '
              f'[{title}](https://www.youtube.com/watch?v={video_id})'
          )

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          new_readme = re.sub(
              r"<!-- YOUTUBE_START -->.*<!-- YOUTUBE_END -->",
              f"<!-- YOUTUBE_START -->\n{block}\n<!-- YOUTUBE_END -->",
              readme,
              flags=re.DOTALL,
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_readme)
          PY

      - name: Commit updated README
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git diff --quiet || (git add README.md && git commit -m "📺 último video actualizado")
          git push
