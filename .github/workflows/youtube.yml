name: 📺 Último Video de YouTube

on:
  schedule:
    - cron: "0 */6 * * *" # Cada 6 horas
  workflow_dispatch:

jobs:
  update-video:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch latest video and update README
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          API_KEY = os.environ["YOUTUBE_API_KEY"]
          # Playlist de "subidas" del canal: mismo ID que el canal, cambiando el
          # prefijo "UC" por "UU" (convención de YouTube para la uploads playlist).
          UPLOADS_PLAYLIST_ID = "UUiLwp9BQNx497pj3Z2nn-kA"

          url = (
              "https://www.googleapis.com/youtube/v3/playlistItems"
              f"?part=snippet&maxResults=1&playlistId={UPLOADS_PLAYLIST_ID}&key={API_KEY}"
          )

          with urllib.request.urlopen(url, timeout=15) as resp:
              data = json.load(resp)

          snippet = data["items"][0]["snippet"]
          video_id = snippet["resourceId"]["videoId"]
          title = snippet["title"]

          block = (
              f'<a href="https://www.youtube.com/watch?v={video_id}">'
              f'<img src="https://i.ytimg.com/vi/{video_id}/hqdefault.jpg" width="45%" alt="Último video" />'
              f'</a>\n\n**🎬 Último video:** '
              f'[{title}](https://www.youtube.com/watch?v={video_id})'
          )

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          new_readme = re.sub(
              r"<!-- YOUTUBE_START -->.*<!-- YOUTUBE_END -->",
              f"<!-- YOUTUBE_START -->\n{block}\n<!-- YOUTUBE_END -->",
              readme,
              flags=re.DOTALL,
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_readme)
          PY

      - name: Commit updated README
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git diff --quiet || (git add README.md && git commit -m "📺 último video actualizado")
          git push
